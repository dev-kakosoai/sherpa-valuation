name: Release

# Publishes to PyPI and npm when a GitHub release is published.
# - PyPI: trusted publishing (OpenID Connect), no token. Configure once on pypi.org:
#   project sherpa-valuation -> Publishing -> GitHub: owner dev-kakosoai,
#   repository sherpa-valuation, workflow release.yml, environment pypi;
#   then set the repository variable PUBLISH_PYPI to true.
# - npm: the NPM_TOKEN repository secret (an npm automation token for the
#   @equipmentsfinder scope). Without it the npm job is skipped.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build pytest && pip install -e . && pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      # setup-node puts a placeholder in NODE_AUTH_TOKEN when the secret is
      # empty, so the presence of the secret is checked on its own.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Skip without an npm token
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "NPM_TOKEN is not set; skipping npm publish."
      - uses: actions/checkout@v4
        if: env.HAS_NPM_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm ci
      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
