[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sherpa-valuation"
version = "0.1.0"
description = "SHERPA - Shrinkage-based Heavy Equipment Residual Price Analysis: an explainable model of used heavy-equipment sale prices and rental rates, fitted from marketplace listings."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "EquipmentsFinder", email = "support@equipmentsfinder.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["heavy-equipment", "valuation", "residual-value", "depreciation", "rental-rates", "empirical-bayes", "conformal-prediction"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dev-kakosoai/sherpa-valuation"
"EquipmentsFinder" = "https://www.equipmentsfinder.com"
Documentation = "https://github.com/dev-kakosoai/sherpa-valuation/blob/main/docs/MODEL.md"

[tool.setuptools]
packages = ["sherpa_valuation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
